name: Periodic quality evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '21 5 * * 1'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate independent evaluation seeds
        run: npm run quality:evals
      - name: Curated mutation probes
        run: npm run quality:mutations
      - name: Repeated adapter benchmark
        run: npm run quality:benchmark
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: periodic-quality-evidence
          path: .aioson/runtime/quality/
          include-hidden-files: true
          retention-days: 30
